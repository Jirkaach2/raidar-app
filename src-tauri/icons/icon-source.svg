<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Oxidized steel plate: warm rusted core fading to gunmetal edges -->
    <radialGradient id="plate" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#3c2a1d"/>
      <stop offset="0.45" stop-color="#23190f"/>
      <stop offset="0.78" stop-color="#14110d"/>
      <stop offset="1" stop-color="#090a0d"/>
    </radialGradient>
    <!-- Beveled metal rim -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b513c"/>
      <stop offset="0.5" stop-color="#33261b"/>
      <stop offset="1" stop-color="#110c08"/>
    </linearGradient>
    <!-- Radar scope glass -->
    <radialGradient id="glass" cx="50%" cy="44%" r="62%">
      <stop offset="0" stop-color="#1d1712"/>
      <stop offset="0.7" stop-color="#120f0c"/>
      <stop offset="1" stop-color="#0a0807"/>
    </radialGradient>
    <!-- Sweep wedge fill -->
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a44" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff7a44" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sweepGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blip" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="0.35" stop-color="#ff8a4d"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rustspot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8552a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a8552a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bolt" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#7d6450"/>
      <stop offset="0.55" stop-color="#3f2f22"/>
      <stop offset="1" stop-color="#1a120c"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropsh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="scopeClip"><circle cx="512" cy="512" r="360"/></clipPath>
  </defs>

  <!-- ── Steel plate ── -->
  <g filter="url(#dropsh)">
    <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#plate)"/>
    <rect x="64" y="64" width="896" height="896" rx="208" fill="none" stroke="url(#rim)" stroke-width="10"/>
    <rect x="78" y="78" width="868" height="868" rx="196" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- Oxidation patches -->
  <circle cx="250" cy="780" r="200" fill="url(#rustspot)"/>
  <circle cx="800" cy="240" r="180" fill="url(#rustspot)"/>

  <!-- Brushed-metal striations -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="2">
    <line x1="120" y1="190" x2="904" y2="190"/>
    <line x1="120" y1="262" x2="904" y2="262"/>
    <line x1="120" y1="834" x2="904" y2="834"/>
    <line x1="120" y1="762" x2="904" y2="762"/>
  </g>

  <!-- ── Corner bolts ── -->
  <g>
    <g transform="translate(214 214)">
      <circle r="30" fill="#0c0907"/>
      <circle r="25" fill="url(#bolt)" stroke="#0c0907" stroke-width="2"/>
      <path d="M-12 -7 L0 -14 L12 -7 L12 7 L0 14 L-12 7 Z" fill="none" stroke="#0c0907" stroke-opacity="0.6" stroke-width="3"/>
      <circle r="5" fill="#1a120c"/>
    </g>
    <g transform="translate(810 214)">
      <circle r="30" fill="#0c0907"/>
      <circle r="25" fill="url(#bolt)" stroke="#0c0907" stroke-width="2"/>
      <path d="M-12 -7 L0 -14 L12 -7 L12 7 L0 14 L-12 7 Z" fill="none" stroke="#0c0907" stroke-opacity="0.6" stroke-width="3"/>
      <circle r="5" fill="#1a120c"/>
    </g>
    <g transform="translate(214 810)">
      <circle r="30" fill="#0c0907"/>
      <circle r="25" fill="url(#bolt)" stroke="#0c0907" stroke-width="2"/>
      <path d="M-12 -7 L0 -14 L12 -7 L12 7 L0 14 L-12 7 Z" fill="none" stroke="#0c0907" stroke-opacity="0.6" stroke-width="3"/>
      <circle r="5" fill="#1a120c"/>
    </g>
    <g transform="translate(810 810)">
      <circle r="30" fill="#0c0907"/>
      <circle r="25" fill="url(#bolt)" stroke="#0c0907" stroke-width="2"/>
      <path d="M-12 -7 L0 -14 L12 -7 L12 7 L0 14 L-12 7 Z" fill="none" stroke="#0c0907" stroke-opacity="0.6" stroke-width="3"/>
      <circle r="5" fill="#1a120c"/>
    </g>
  </g>

  <!-- ── Radar scope ── -->
  <circle cx="512" cy="512" r="360" fill="url(#glass)"/>

  <g clip-path="url(#scopeClip)">
    <!-- range rings -->
    <g fill="none" stroke="#ff6a3d" stroke-opacity="0.22" stroke-width="3">
      <circle cx="512" cy="512" r="120"/>
      <circle cx="512" cy="512" r="230"/>
      <circle cx="512" cy="512" r="340"/>
    </g>
    <!-- bearing cross -->
    <g stroke="#ff6a3d" stroke-opacity="0.16" stroke-width="3">
      <line x1="512" y1="172" x2="512" y2="852"/>
      <line x1="172" y1="512" x2="852" y2="512"/>
    </g>

    <!-- sweep trail (faint → bright toward leading edge) -->
    <path d="M512 512 L392 183 A350 350 0 0 1 512 162 Z" fill="#ff7a44" opacity="0.06"/>
    <path d="M512 512 L512 162 A350 350 0 0 1 660 195 Z" fill="#ff7a44" opacity="0.12"/>
    <path d="M512 512 L660 195 A350 350 0 0 1 725 234 Z" fill="#ff7a44" opacity="0.20"/>
    <path d="M512 512 L725 234 A350 350 0 0 1 780 287 Z" fill="url(#sweep)" opacity="0.5"/>
    <!-- leading edge -->
    <line x1="512" y1="512" x2="780" y2="287" stroke="#ffae7d" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- target blip -->
    <circle cx="686" cy="332" r="46" fill="url(#blip)"/>
    <circle cx="686" cy="332" r="13" fill="#fff2e6"/>
    <circle cx="686" cy="332" r="24" fill="none" stroke="#ffd9b0" stroke-width="3" stroke-opacity="0.7"/>
  </g>

  <!-- scope outer ring + bezel -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#0a0807" stroke-width="14"/>
  <circle cx="512" cy="512" r="360" fill="none" stroke="#ff6a3d" stroke-opacity="0.4" stroke-width="4"/>
  <circle cx="512" cy="512" r="346" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- rim ticks -->
  <g stroke="#ff8a5a" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <line x1="850" y1="512" x2="872" y2="512"/>
    <line x1="751" y1="751" x2="767" y2="767"/>
    <line x1="512" y1="850" x2="512" y2="872"/>
    <line x1="273" y1="751" x2="257" y2="767"/>
    <line x1="174" y1="512" x2="152" y2="512"/>
    <line x1="273" y1="273" x2="257" y2="257"/>
    <line x1="512" y1="174" x2="512" y2="152"/>
    <line x1="751" y1="273" x2="767" y2="257"/>
  </g>

  <!-- center hub -->
  <g filter="url(#glow)">
    <circle cx="512" cy="512" r="22" fill="none" stroke="#ff8a5a" stroke-width="5" stroke-opacity="0.8"/>
    <circle cx="512" cy="512" r="11" fill="#ff7a44"/>
  </g>

  <!-- top rim light -->
  <path d="M232 200 A360 360 0 0 1 792 200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6" stroke-linecap="round"/>
</svg>
